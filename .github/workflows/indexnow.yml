name: IndexNow ping

# After each push to main, wait for Vercel to deploy, then tell IndexNow engines
# (Bing, Yandex, Seznam, Naver, ...) which URLs exist. Google does not use IndexNow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deployment
        run: sleep 150
      - name: Submit sitemap URLs
        env:
          HOST: www.shekharkumar.com
          KEY: 5e7a4653068671a7ea5189b0aa7aa00b
        run: |
          URLS=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          echo "Submitting $(echo "$URLS" | jq length) URLs"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" \
            -w "IndexNow HTTP %{http_code}\n"
